name: Build

on:
  push:
    branches:
      - 'main'
      - 'release/**'
      - 'force-ci/**'
      - 'xpf/**'
      - '!release/latest'
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 12.1.4-lightplayer.14; leave empty for automatic versioning)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: 1
  PACKAGE_VERSION: ${{ inputs.version }}

jobs:

  linux:
    name: Linux
    runs-on: ubuntu-24.04

    steps:
      - &step-checkout
        name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - &step-dotnet
        name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
          global-json-file: global.json

      - name: Install Workloads
        run: dotnet workload install android macos wasm-tools

      - name: Run Build
        run: |
          dotnet --info
          printenv
          build_args=(--target CiLinux --configuration Release)
          if [[ -n "$PACKAGE_VERSION" ]]; then
            build_args+=(--force-nuget-version "$PACKAGE_VERSION")
          fi
          ./build.sh "${build_args[@]}"

  macos:
    name: macOS
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - *step-checkout

      - *step-dotnet

      - name: Install Workloads
        run: dotnet workload install android ios tvos maccatalyst macos wasm-tools

      - name: Run Build
        run: |
          dotnet --info
          printenv
          build_args=(--target CiMacOS --configuration Release)
          if [[ -n "$PACKAGE_VERSION" ]]; then
            build_args+=(--force-nuget-version "$PACKAGE_VERSION")
          fi
          ./build.sh "${build_args[@]}"

      - name: Upload Native Library
        uses: actions/upload-artifact@v7
        with:
          name: native-macos
          path: artifacts/native/Release/
          if-no-files-found: error

      - name: Upload Package Files
        uses: actions/upload-artifact@v7
        with:
          name: nuget-macos
          path: artifacts/nuget
          if-no-files-found: error

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-macos
          path: artifacts/sbom
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-2025

    steps:
      - *step-checkout

      - *step-dotnet

      - name: Install Workloads
        run: dotnet workload install android ios tvos maccatalyst macos wasm-tools

      - name: Run Build
        run: |
          $buildArgs = @('--target', 'CiWindows', '--configuration', 'Release')
          if ($env:PACKAGE_VERSION) {
            $buildArgs += @('--force-nuget-version', $env:PACKAGE_VERSION)
          }
          ./build.cmd @buildArgs

      - name: Upload Package Files
        uses: actions/upload-artifact@v7
        with:
          name: nuget-windows
          path: artifacts/nuget
          if-no-files-found: error

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-windows
          path: artifacts/sbom
          if-no-files-found: error

  publish-packages:
    name: Publish Package Files
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04

    steps:
      - name: Download Windows Package Files
        uses: actions/download-artifact@v7
        with:
          name: nuget-windows
          path: packages

      - name: Download macOS Package Files
        uses: actions/download-artifact@v7
        with:
          name: nuget-macos
          path: nuget-macos

      - name: Assemble Package Files
        run: cp nuget-macos/Avalonia.Native.*nupkg packages/

      - name: Upload Package Files
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: packages/
          if-no-files-found: error
