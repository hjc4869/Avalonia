name: Build

on:
  push:
    branches:
      - 'main'
      - 'release/**'
      - 'force-ci/**'
      - 'xpf/**'
      - '!release/latest'
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: 1

jobs:

  version:
    name: Generate Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate Package Version
        id: version
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          root = ET.parse("build/SharedVersion.props").getroot()
          version = root.find("{*}PropertyGroup/{*}Version").text
          major, minor, patch = map(int, version.split("."))
          package_version = f"{major}.{minor}.{patch + 1}-custom.{os.environ['GITHUB_RUN_NUMBER']}"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"version={package_version}", file=output)
          PY

  linux:
    name: Linux
    needs: version
    runs-on: ubuntu-24.04
    env:
      PACKAGE_VERSION: ${{ needs.version.outputs.version }}

    steps:
      - &step-checkout
        name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - &step-dotnet
        name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
          global-json-file: global.json

      - name: Install Workloads
        run: dotnet workload install android macos wasm-tools

      - name: Run Build
        run: |
          dotnet --info
          printenv
          ./build.sh --target CiLinux --configuration Release --force-nuget-version "$PACKAGE_VERSION"

  macos:
    name: macOS
    needs: version
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      PACKAGE_VERSION: ${{ needs.version.outputs.version }}

    steps:
      - *step-checkout

      - *step-dotnet

      - name: Install Workloads
        run: dotnet workload install android ios tvos maccatalyst macos wasm-tools

      - name: Run Build
        run: |
          dotnet --info
          printenv
          ./build.sh --target CiMacOS --configuration Release --force-nuget-version "$PACKAGE_VERSION"

      - name: Upload Native Library
        uses: actions/upload-artifact@v7
        with:
          name: native-macos
          path: artifacts/native/Release/
          if-no-files-found: error

      - name: Upload Package Files
        uses: actions/upload-artifact@v7
        with:
          name: nuget-macos
          path: artifacts/nuget
          if-no-files-found: error

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-macos
          path: artifacts/sbom
          if-no-files-found: error

  windows:
    name: Windows
    needs: version
    runs-on: windows-2025
    env:
      PACKAGE_VERSION: ${{ needs.version.outputs.version }}

    steps:
      - *step-checkout

      - *step-dotnet

      - name: Install Workloads
        run: dotnet workload install android ios tvos maccatalyst macos wasm-tools

      - name: Run Build
        run: |
          ./build.cmd --target CiWindows --configuration Release --force-nuget-version "$env:PACKAGE_VERSION"

      - name: Upload Package Files
        uses: actions/upload-artifact@v7
        with:
          name: nuget-windows
          path: artifacts/nuget
          if-no-files-found: error

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-windows
          path: artifacts/sbom
          if-no-files-found: error

  publish-packages:
    name: Publish Release
    needs: [version, linux, windows, macos]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      PACKAGE_VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Download Windows Package Files
        uses: actions/download-artifact@v7
        with:
          name: nuget-windows
          path: packages

      - name: Download macOS Package Files
        uses: actions/download-artifact@v7
        with:
          name: nuget-macos
          path: nuget-macos

      - name: Assemble Package Files
        run: cp nuget-macos/Avalonia.Native.*nupkg packages/

      - name: Create NuGet Archive
        run: zip -j "Avalonia-NuGet-$PACKAGE_VERSION.zip" packages/*nupkg

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$PACKAGE_VERSION" "Avalonia-NuGet-$PACKAGE_VERSION.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$PACKAGE_VERSION" \
            --notes "Custom build of commit $GITHUB_SHA." \
            --prerelease \
            --latest=false
